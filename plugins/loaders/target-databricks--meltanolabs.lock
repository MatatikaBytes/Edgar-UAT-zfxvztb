      "sensitive": false,
      "required": "true",
      "configured": false,
      "protected": false
    },
    {
      "name": "http_path",
      "kind": "string",
      "label": "HTTP Path",
      "description": "SQL warehouse HTTP path, e.g. `/sql/1.0/warehouses/abc`.",
      "hidden": false,
      "sensitive": false,
      "required": "true",
      "configured": false,
      "protected": false
    },
    {
      "name": "auth_type",
      "kind": "options",
      "value": "pat",
