{
  "plugin_type": "loaders",
  "name": "target-databricks",
  "namespace": "databricks",
  "variant": "meltanolabs",
  "label": "Databricks",
  "repo": "https://github.com/MeltanoLabs/target-databricks",
  "pip_url": "git+https://github.com/MeltanoLabs/target-databricks.git@v0.1.2",
  "python": "python3.13",
  "executable": "target-databricks",
  "description": "Databricks is a unified data and AI platform built on a lakehouse architecture. This loader\nwrites records into Delta tables in Unity Catalog through a Databricks SQL warehouse, using\n`INSERT` or `MERGE` statements depending on the load method.\n\n### Prerequisites\n\n1. **Server Hostname** and **HTTP Path**: open your SQL warehouse in the Databricks workspace\nand copy both values from the **Connection details** tab.\n\n2. **Credentials**: authenticate with one of the following.\n\n- **Personal access token** (`auth_type: pat`, the default) \u2014 generate a token under\n  **Settings > Developer > Access tokens** and set it as `access_token`.\n- **Service principal** (`auth_type: oauth_m2m`) \u2014 create an OAuth secret for a service\n  principal and set `client_id` and `client_secret`. Recommended for unattended use.\n\n3. **Permissions**: the user or service principal needs `CAN USE` on the SQL warehouse,\n`USE CATALOG` on the catalog, and `USE SCHEMA`, `CREATE SCHEMA` and `CREATE TABLE` (or\nequivalent ownership) on the target schema. Large batches are staged as Parquet in a Unity\nCatalog volume named `meltano_staging`, created in the target schema if missing, so the\nprincipal also needs `CREATE VOLUME` and `WRITE VOLUME`. Without them the loader logs a\nwarning once and falls back to slower inline inserts.\n\n### Target schema\n\nSet `default_target_schema` to load every stream into one schema. If it is unset, the schema\nis taken from `<schema>-<table>` stream names. The schema is created if it does not exist;\nuse `schema_creation_parameters.retention_days` to configure how long dropped tables remain\nrecoverable with `UNDROP TABLE` in schemas created this way.\n",
  "logo_url": "/assets/logos/loaders/databricks.png",
  "capabilities": [
    "about",
    "batch",
    "schema-flattening",
    "stream-maps",
    "structured-logging",
    "validate-records"
  ],
  "settings": [
